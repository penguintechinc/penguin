# goreleaser config for the penguin endpoint agent.
# Builds penguin (CLI) + penguind (daemon) for Linux/macOS/Windows on
# amd64+arm64, packages deb/rpm, produces an SBOM, and minisign-signs every
# archive so the in-app self-updater can verify downloads.
#
# penguin-tray is intentionally NOT built here: it needs cgo (systray/objc on
# macOS), so it is released from a separate cgo-enabled matrix.
version: 2

project_name: penguin

builds:
  - id: penguin
    main: ./cmd/penguin
    binary: penguin
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/penguintechinc/penguin/internal/version.Version={{.Version}}
  - id: penguind
    main: ./cmd/penguind
    binary: penguind
    env: [CGO_ENABLED=0]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
    ldflags:
      - -s -w -X github.com/penguintechinc/penguin/internal/version.Version={{.Version}}

archives:
  - id: default
    # Matches the self-updater's expected asset name:
    # penguin_<version>_<goos>_<goarch>.tar.gz
    name_template: "penguin_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]

nfpms:
  - id: packages
    package_name: penguin
    formats: [deb, rpm]
    maintainer: PenguinTech <support@penguintech.io>
    description: PenguinTech unified endpoint agent
    license: AGPL-3.0
    bindir: /usr/bin
    contents:
      - src: packaging/systemd/penguind.service
        dst: /lib/systemd/system/penguind.service

sboms:
  - artifacts: archive

# minisign every archive/package so the self-updater can verify it. The signer
# reads the base64 secret key from the MINISIGN_KEY env var set in CI.
# Also cosign keyless-sign the checksums file for Sigstore provenance.
signs:
  - id: minisign
    cmd: minisign
    signature: "${artifact}.minisig"
    args: ["-S", "-s", "{{ .Env.MINISIGN_KEY }}", "-m", "${artifact}", "-x", "${signature}"]
    artifacts: all
  - id: cosign
    cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args: ["sign-blob", "--yes", "--output-signature=${signature}", "--output-certificate=${certificate}", "${artifact}"]
    artifacts: checksum
    output: true

checksum:
  name_template: "checksums.txt"

release:
  github:
    owner: penguintechinc
    name: penguin
