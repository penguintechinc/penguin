# Penguin endpoint agent — Rust workspace root.
#
# The complete Go implementation is frozen under `go-client/` as its own Go
# module (NOT a Cargo member) and serves as the feature-parity conformance
# oracle. Every crate here is being ported to reach parity with it. See
# ~/.claude/plans/create-a-plan-to-goofy-hopcroft.md for the full migration plan.
#
# House style (learning-oriented): keep turbofish and match-arms/closures to a
# minimum, prefer explicit types + named helpers + if-let, and document every
# module/type/fn with a `///` (what + why) comment.

[workspace]
resolver = "3"
members = ["crates/*", "bins/*", "examples/plugin-hello-rs"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "LicenseRef-PenguinTech"
repository = "https://github.com/penguintechinc/penguin"

# Shared dependency versions are pinned here as crates are introduced per
# milestone (M1+). Risk-bearing crates use an exact `=x.y.z`; the rest use a
# semver-compatible range. Cargo.lock is committed, so even the ranges resolve
# to one cryptographically-pinned version.
[workspace.dependencies]

# Internal crates, referenced by path. Added here as each milestone lands so
# dependents can write `penguin-sdk.workspace = true`.
penguin-proto = { path = "crates/penguin-proto" }
penguin-sdk = { path = "crates/penguin-sdk" }
penguin-telemetry = { path = "crates/penguin-telemetry" }
penguin-ipc = { path = "crates/penguin-ipc" }
penguin-daemon = { path = "crates/penguin-daemon" }
# The external-plugin path: verification pipeline + the go-plugin host that
# launches a verified binary. The daemon depends on both so LoadModule can
# resolve a builtin OR an external module through one code path.
penguin-extplugin = { path = "crates/penguin-extplugin" }
penguin-goplugin-host = { path = "crates/penguin-goplugin-host" }

# gRPC / protobuf. Wire-compatibility with the Go daemon and go-plugin is the
# whole point of the rewrite, so these are pinned exactly.
tonic = "=0.14.6"
tonic-prost = "=0.14.6"
prost = "=0.14.4"
tonic-prost-build = "=0.14.6"

# Contract plumbing.
async-trait = "0.1"
thiserror = "2"

# Async runtime + transport plumbing for the daemon and its IPC listener.
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "fs",
    "sync",
    "time",
    "io-util",
    "signal",
    # Spawning and managing plugin subprocesses (penguin-goplugin-host) needs
    # tokio's process module; nothing else currently requires disabling it.
    "process",
] }
tokio-stream = { version = "0.1", features = ["net"] }
# CancellationToken is the direct analogue of Go's context.WithCancel, used for
# the supervisor lifetime and per-module cancellation.
tokio-util = { version = "0.7", features = ["rt"] }
# gRPC health service the go-plugin host and the daemon both expose.
tonic-health = "=0.14.6"
# Restart-backoff jitter. The exact Go formula is ported by hand rather than
# using a backoff crate, because those use different jitter maths.
rand = "0.9"
# Cross-platform single-instance file lock (flock on Unix, LockFileEx on
# Windows) — one crate instead of two cfg-gated modules.
fs4 = "0.13"

# CLI parsing. penguind's service subcommands are a fixed set (derive reads
# best); the `penguin` CLI builds its tree at runtime from the daemon's
# ListCommands RPC, which needs the builder API.
clap = { version = "4", features = ["derive"] }

# go-plugin AutoMTLS. Plugins present a self-signed ECDSA **P-521** certificate,
# and rustls' default `ring` provider cannot verify secp521r1 at all — so
# default features are off everywhere here and aws-lc-rs is selected explicitly.
# Getting this wrong does not degrade gracefully: the handshake simply fails
# against every existing Go-built plugin.
rustls = { version = "0.23", default-features = false, features = [
    "aws-lc-rs",
    "std",
    "tls12",
    "logging",
] }
tokio-rustls = { version = "0.26", default-features = false, features = [
    "aws-lc-rs",
    "tls12",
] }
# Our own host certificate is ECDSA P-256, not P-521: Go accepts whatever we put
# in its trust pool, so there is no reason to demand P-521 keygen from rcgen.
# The "aws_lc_rs" feature (which implies "crypto") is required, not optional:
# rcgen's `KeyPair`/`CertificateParams::self_signed` are compiled out entirely
# without a crypto backend feature, so cert generation is simply unavailable
# without it. It reuses the exact backend rustls above already requires, so
# this adds no new crypto implementation to the dependency graph.
rcgen = { version = "0.14", default-features = false, features = [
    "pem",
    "aws_lc_rs",
] }
base64 = "0.22"
# Bridges tokio's AsyncRead/AsyncWrite to hyper's own Read/Write traits.
# Required for penguin-goplugin-host's custom TLS-over-unix-socket gRPC
# connector: tonic's `Endpoint::connect_with_connector` requires the hyper
# traits, which only `hyper` and `hyper-util` provide, and neither is
# re-exported by tonic. Already resolves to the same version tonic pulls in
# transitively for its own connectors, so this adds no new dependency
# version to the graph — only a direct name for one already being built.
hyper-util = { version = "0.1", default-features = false, features = [
    "tokio",
] }

# Unix user/group resolution. getgrouplist(3) is NSS-aware, matching the Go
# os/user (cgo) behaviour on LDAP/sssd hosts — a plain /etc/group parse would
# silently diverge there.
nix = { version = "0.30", features = ["user", "fs"] }

# OS keychain backends (Windows Credential Manager, macOS Keychain, Linux
# Secret Service). Unlike Go's 99designs/keyring this crate has NO encrypted
# -file fallback, so penguin-secrets implements that backend itself — which is
# also why Go's JWE-encrypted files are not readable by it (see docs/PARITY.md).
keyring = "4.1.5"
# The file backend's cipher: XChaCha20-Poly1305, 24-byte random nonce prefixed
# to each record, AAD bound to the namespaced key so a record cannot be moved
# between keys.
chacha20poly1305 = "0.10"
# Master keys and decrypted secrets are wiped on drop rather than lingering.
zeroize = { version = "1", features = ["derive"] }

# License-server client. IMPORTANT: default features are off because reqwest's
# stock TLS would pull in `ring`, and this workspace is pinned to aws-lc-rs for
# the go-plugin P-521 work. Two crypto backends in one binary is a smell; the
# gate is that `cargo tree -i ring` stays empty.
reqwest = { version = "0.13", default-features = false, features = [
    "json",
    # "rustls-no-provider" (NOT "rustls-tls-manual-roots-no-provider", which an
    # earlier 0.13.x used) — the caller supplies both the crypto provider and
    # the roots, which is exactly what we want: aws-lc-rs + webpki-roots.
    "rustls-no-provider",
    "http2",
    "charset",
] }
webpki-roots = "1"

# Metrics. tikv's prometheus crate (not the abandoned one); `process` adds the
# /proc-based process collector that mirrors the Go process collector. Default
# features stay on — gather()'s protobuf model and the process collector rely
# on them.
prometheus = { version = "0.14", features = ["process"] }

# Logging. tracing replaces zap; the JSON + env-filter features cover the
# structured-output and level-parsing parity we need.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "json", "env-filter"] }

# Config store: YAML parse + JSON-Schema validation. serde-norway is the
# maintained fork of the archived serde_yaml; jsonschema is pinned exactly
# because cross-engine verdict parity with the Go validator is a CI gate.
serde = { version = "1", features = ["derive"] }
serde-norway = { package = "serde_norway", version = "0.9.42" }
serde_json = "1"
jsonschema = "=0.47.0"

# Deny unsafe workspace-wide; the few legitimate sites (Windows SDDL / named-pipe
# glue in penguin-ipc) opt back in per-file with an allow + justification.
[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
# Nudge toward the readable, learning-oriented style described above.
all = { level = "warn", priority = -1 }
