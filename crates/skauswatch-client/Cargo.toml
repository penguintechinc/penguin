[package]
name = "skauswatch-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# SkausWatch agent API client: HTTP transport authenticated with a static,
# out-of-band provisioned x-agent-id/x-api-key header pair (no client-side
# HMAC/signing — see src/auth.rs). Default features stay off (see root
# Cargo.toml comment on the reqwest entry): the workspace is pinned to
# aws-lc-rs, so TLS is wired manually with rustls + webpki-roots, matching
# squawk-client's pattern.
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
webpki-roots.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
# Real hostname for the registration payload — see `client::local_hostname`'s
# doc comment. `nix` is Unix-only (doesn't compile for Windows), so it's
# target-gated here rather than a plain `[dependencies]` entry; Windows uses
# `COMPUTERNAME` via std instead. Already in the workspace lock with the
# "hostname" feature via `bins/penguind`'s identical use, so this adds no new
# crate version to the graph.
nix = { workspace = true, features = ["hostname"] }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
