[package]
name = "skauswatch-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# SkausWatch agent API client: HTTP transport with HMAC-SHA256 request signing.
# Default features stay off (see root Cargo.toml comment on the reqwest entry):
# the workspace is pinned to aws-lc-rs, so TLS is wired manually with rustls +
# webpki-roots, matching squawk-client's pattern.
reqwest = { workspace = true, features = ["json"] }
rustls.workspace = true
webpki-roots.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# HMAC-SHA256 request signing for agent authentication.
hmac = "=0.12.1"
# SHA256 message digest for HMAC computation.
sha2 = "=0.10.9"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
