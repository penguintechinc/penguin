// Module is the plugin-side gRPC contract for external modules.
// It mirrors sdk.Module 1:1 across the go-plugin boundary.
// The plugin implements ModuleService; the daemon implements HostService.
syntax = "proto3";

package penguin.sdk.v1;

option go_package = "github.com/penguintechinc/penguin/pkg/sdk/proto/penguin/sdk/v1;sdkv1";

// ModuleService is the gRPC interface an external plugin implements.
// All request messages include api_version per PenguinTech gRPC standards.
// Unknown api_version → return UNIMPLEMENTED.
service ModuleService {
  rpc Info(InfoRequest) returns (InfoResponse);
  rpc Init(InitRequest) returns (InitResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Status(StatusRequest) returns (StatusResponse);
  rpc Health(HealthRequest) returns (HealthResponse);
  rpc Commands(CommandsRequest) returns (CommandsResponse);
  rpc Dispatch(DispatchRequest) returns (DispatchResponse);
  rpc ConfigSchema(ConfigSchemaRequest) returns (ConfigSchemaResponse);
}

// HostService is the reverse direction: the daemon serves this over go-plugin's
// gRPC broker so plugins can call back into daemon capabilities (logging, secrets,
// licensing, config, events).
service HostService {
  rpc Log(LogRequest) returns (LogResponse);
  rpc SecretsGet(SecretsGetRequest) returns (SecretsGetResponse);
  rpc SecretsSet(SecretsSetRequest) returns (SecretsSetResponse);
  rpc SecretsDelete(SecretsDeleteRequest) returns (SecretsDeleteResponse);
  rpc LicenseFeatureEnabled(LicenseFeatureEnabledRequest) returns (LicenseFeatureEnabledResponse);
  rpc LicenseTier(LicenseTierRequest) returns (LicenseTierResponse);
  rpc DataDir(DataDirRequest) returns (DataDirResponse);
  rpc Config(ConfigRequest) returns (ConfigResponse);
  rpc PublishEvent(PublishEventRequest) returns (PublishEventResponse);
}

// ---- ModuleService Messages ----

message InfoRequest { string api_version = 1; }
message InfoResponse {
  string name = 1;
  string version = 2;
  string description = 3;
  string license_feature = 4;
}

message InitRequest { string api_version = 1; }
message InitResponse { string error = 1; }

message StartRequest { string api_version = 1; }
message StartResponse { string error = 1; }

message StopRequest { string api_version = 1; }
message StopResponse { string error = 1; }

message StatusRequest { string api_version = 1; }
message StatusResponse {
  string state = 1;
  map<string, string> detail = 2;
  string error = 3;
}

message HealthRequest { string api_version = 1; }
message HealthResponse {
  int32 level = 1; // 0=healthy, 1=degraded, 2=unhealthy
  string message = 2;
  int64 checked_at_unix_nano = 3;
}

message CommandsRequest { string api_version = 1; }
message FlagSpec {
  string name = 1;
  string shorthand = 2;
  string usage = 3;
  string default = 4;
  string type = 5; // "string" | "bool" | "int"
}
message CommandSpec {
  string name = 1;
  string use = 2;
  string short = 3;
  repeated FlagSpec flags = 4;
  repeated CommandSpec subcommands = 5;
  bool tray = 6;
  int32 min_args = 7;
  int32 max_args = 8;
}
message CommandsResponse {
  repeated CommandSpec commands = 1;
}

message DispatchRequest {
  string api_version = 1;
  repeated string path = 2;
  map<string, string> flags = 3;
  repeated string args = 4;
}
message DispatchResponse {
  string output = 1;
  bytes json = 2;
  int32 exit_code = 3;
  string error = 4;
}

message ConfigSchemaRequest { string api_version = 1; }
message ConfigSchemaResponse {
  bytes schema = 1; // JSON Schema bytes, or empty if no configuration
}

// ---- HostService Messages ----

message LogRequest {
  string api_version = 1;
  string level = 2; // "debug" | "info" | "warn" | "error"
  string message = 3;
  map<string, string> fields = 4;
}
message LogResponse {}

message SecretsGetRequest {
  string api_version = 1;
  string key = 2;
}
message SecretsGetResponse {
  bytes value = 1;
  string error = 2; // Set if key not found or other error
}

message SecretsSetRequest {
  string api_version = 1;
  string key = 2;
  bytes value = 3;
}
message SecretsSetResponse {
  string error = 1;
}

message SecretsDeleteRequest {
  string api_version = 1;
  string key = 2;
}
message SecretsDeleteResponse {
  string error = 1;
}

message LicenseFeatureEnabledRequest {
  string api_version = 1;
  string key = 2;
}
message LicenseFeatureEnabledResponse {
  bool enabled = 1;
}

message LicenseTierRequest { string api_version = 1; }
message LicenseTierResponse {
  string tier = 1; // "" | "free" | "professional" | "enterprise"
}

message DataDirRequest { string api_version = 1; }
message DataDirResponse {
  string path = 1;
}

message ConfigRequest { string api_version = 1; }
message ConfigResponse {
  bytes config = 1; // Raw YAML bytes
}

message PublishEventRequest {
  string api_version = 1;
  string module = 2;
  string type = 3; // "state-changed" | "health" | "info" | "error"
  string message = 4;
  int64 at_unix_nano = 5;
  map<string, string> fields = 6;
}
message PublishEventResponse {}
