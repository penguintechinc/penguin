# Dependabot version updates for the Penguin endpoint agent.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Go module dependencies.
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
  # Keep pinned GitHub Actions commit SHAs current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
