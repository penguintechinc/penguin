# PR gate for the Rust workspace: format, clippy (warnings = errors), build,
# tests, and supply-chain (cargo-deny + cargo-audit). The frozen Go client has
# its own workflow (go-client-frozen.yml). Actions pinned to commit SHAs.
name: CI

on:
  pull_request:
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    container: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: components
        run: rustup component add rustfmt clippy
      - name: fmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: build
        run: cargo build --workspace --locked
      - name: test
        run: cargo test --workspace --locked

  supply-chain:
    runs-on: ubuntu-latest
    container: rust:1.97-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: cargo-deny (licenses, bans, sources, advisories)
        run: |
          cargo install cargo-deny --locked
          cargo deny check
      - name: cargo-audit (RustSec advisories)
        run: |
          cargo install cargo-audit --locked
          cargo audit
