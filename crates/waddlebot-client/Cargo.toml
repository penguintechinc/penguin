[package]
name = "waddlebot-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
# Hub API HTTP client. Default features stay off (see root Cargo.toml
# comment on the reqwest entry): the workspace is pinned to aws-lc-rs, so
# TLS is wired manually with rustls + webpki-roots, matching squawk-client's
# doh/license clients. `query` adds `RequestBuilder::query` (used by the
# paginated radio-station and filtered announcement list endpoints) on top
# of the workspace's base feature set — additive, not a fork of the pinned
# version.
reqwest = { workspace = true, features = ["query"] }
rustls.workspace = true
webpki-roots.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Only needed for #[tokio::test] in the integration tests — this crate's own
# async fns are runtime-agnostic and never call tokio directly.
tokio = { workspace = true, features = ["test-util"] }
