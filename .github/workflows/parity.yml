# M8 parity harness — plain-CI gating gates.
#
# Proves behavioural parity between the frozen Go oracle (go-client/) and the
# Rust build across the dimensions that need no privilege: RPC coverage (dim 1),
# CLI tree structure (dim 2), daemon config verdicts (dim 3), event semantics
# (dim 5), file permissions (dim 6), and the metrics golden (dim 4, a cargo test
# owned by the metrics workstream). scripts/parity/run.sh aggregates them and
# also reuses the existing wire-compat + cli-parity precursors.
#
# Runs on the plain runner rather than a container so BOTH toolchains are
# available (the wire-compat.yml pattern): GOTOOLCHAIN=auto fetches the Go
# version go-client/go.mod asks for, rustup honours rust-toolchain.toml. That is
# what lets the Go-oracle halves of config.sh / cli-tree.sh actually run here.
#
# Value-under-load metrics and perf (dim 7) are NOT here — they live in the
# privileged integration tier (integration.yml). wire-compat.yml is left
# intact. Actions are pinned to commit SHAs; no github.event.* is interpolated
# into any run: step.
name: parity

on:
  pull_request:
    paths:
      - "crates/**"
      - "bins/**"
      - "proto/**"
      - "go-client/**"
      - "scripts/parity/**"
      - "scripts/wire-compat/**"
      - "scripts/cli-parity/**"
      - "testdata/config-corpus/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Makefile"
      - ".github/workflows/parity.yml"
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

jobs:
  parity-plain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: protoc
        # libprotobuf-dev supplies the well-known types the vendored go-plugin
        # grpc_stdio.proto imports; protobuf-compiler alone fails that import
        # (same reason as wire-compat.yml / integration.yml).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends protobuf-compiler libprotobuf-dev

      - name: Build the frozen Go oracle (penguin CLI + penguind daemon)
        working-directory: go-client
        env:
          GOTOOLCHAIN: auto
          GOFLAGS: -buildvcs=false
        run: make build

      - name: Build the Rust binaries + the raw wire probe
        run: |
          cargo build -p penguind -p penguin --locked
          cargo build -p penguin --example parity_probe --locked

      - name: Run the parity harness (gating gates)
        env:
          # Binaries are already built above; run.sh only aggregates.
          PG_SKIP_BUILD: "1"
        run: scripts/parity/run.sh
