# PR gate: lint, security scans, and race-tested build in the standard
# golang:1.25-bookworm toolchain. Actions are pinned to commit SHAs per policy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: golangci-lint
        # v7+ is required to run golangci-lint v2.x (v6 only supports v1).
        uses: golangci/golangci-lint-action@9fae48acfc02a90574d7c304a1758ef9895495fa # v7.0.1
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Unit tests (race + coverage gate)
        run: make test

  security:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          gosec -exclude-generated ./...

  build:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Build all binaries + example plugin
        run: |
          make build
          go build -o /tmp/plugin-hello ./examples/plugin-hello
      - name: Cross-compile Windows target (pure-Go; catches _windows.go breakage)
        # penguin-tray is excluded — it needs cgo and is built natively in release-tray.yml.
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./cmd/penguind ./cmd/penguin ./internal/... ./pkg/...
      - name: Smoke test
        run: make smoke-test

  # Supply-chain scan carried forward from main's template CI (filesystem vuln +
  # misconfig + secret). Report-only, matching main's non-blocking behavior; the
  # pre-push hook gates trivy locally, and govulncheck above gates Go vulns.
  # Runs on the bare runner (not the golang container) so trivy-action can
  # install the scanner. Action pinned to the v0.35.0 commit SHA.
  trivy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
