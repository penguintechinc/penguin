# The Go client is frozen under go-client/ as the feature-parity conformance
# oracle. This job proves it still builds and passes its unit gate. Artifact
# uploads for the Rust compat jobs are added in M2/M3. Actions pinned to SHAs.
name: go-client (frozen)

on:
  pull_request:
    paths:
      - "go-client/**"
      - ".github/workflows/go-client-frozen.yml"
  push:
    branches: [main, "release/**"]

permissions:
  contents: read

defaults:
  run:
    working-directory: go-client

jobs:
  build-test:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build + unit tests (coverage gate)
        run: make build && make test
