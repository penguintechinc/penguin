[package]
name = "penguin-otel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
thiserror.workspace = true
penguin-sdk.workspace = true
tracing.workspace = true
# Installs the process-default rustls crypto provider before the exporters'
# reqwest::blocking::Client is built — see ensure_crypto_provider_installed's
# doc in pipeline.rs. The workspace's reqwest entry uses `rustls-no-provider`
# (deliberately, so every caller supplies its own provider explicitly rather
# than reqwest silently picking one), so this crate must do the same install
# every other reqwest-building crate here already does (penguin-licensing,
# penguin-module-tobogganing, penguin-update, squawk-client,
# waddlebot-client, penguin-goplugin-host) rather than relying on one of them
# happening to run first in the same process.
rustls.workspace = true

# OpenTelemetry pipeline: exports over OTLP/HTTP (never grpc-tonic — the
# workspace pins tonic/prost exactly for the go-plugin wire protocol, and
# opentelemetry-otlp's grpc-tonic feature would demand a different tonic and
# conflict). Each crate pinned exactly as a self-consistent trio.
#
# HTTP client: reqwest-blocking-client, not reqwest-client. The default
# (thread-based) BatchSpanProcessor/BatchLogProcessor/PeriodicReader this
# crate uses explicitly do not support the async `reqwest-client`/
# `hyper-client` — see opentelemetry_sdk::trace::BatchSpanProcessor's doc
# comment ("async HTTP clients ... are not supported by this default
# processor"). reqwest::blocking::Client manages its own internal runtime, so
# it works from the processor's dedicated OS thread without requiring the
# caller to be inside a Tokio context, and without pulling in the
# `rt-tokio`/experimental-async-runtime feature family.
#
# TLS: neither `reqwest-blocking-client` (-> reqwest/blocking) nor
# `http-proto` request reqwest default features or any TLS feature, so this
# adds no new crypto backend to the graph — it rides the workspace's own
# `reqwest` entry (hyper-rustls + aws-lc-rs). Verified with `cargo tree -p
# reqwest -e features`: still resolves through aws-lc-rs, no `ring`. (`cargo
# tree -i ring` does show `ring` in the workspace, but only via
# boringtun/defguard_boringtun's WireGuard crypto — pre-existing, unrelated
# to reqwest/TLS; see task-4-report.md.)
opentelemetry = { version = "=0.32.0", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
] }
opentelemetry_sdk = { version = "=0.32.1", default-features = false, features = [
    "trace",
    "metrics",
    "logs",
] }
opentelemetry-otlp = { version = "=0.32.0", default-features = false, features = [
    "http-proto",
    "reqwest-blocking-client",
    "trace",
    "metrics",
    "logs",
] }

[dev-dependencies]
tokio.workspace = true
axum.workspace = true
