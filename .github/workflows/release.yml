# Release: on a version tag, build the three binaries for every target,
# sign them (minisign for self-update + cosign for provenance), and publish a
# GitHub Release with an SBOM. Actions pinned to commit SHAs per policy.
name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write # cosign keyless signing

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'
      - uses: sigstore/cosign-installer@d7d6bc7722e3daa8354c50bcb52f4837da5e9b6a # v3.8.1
        with:
          cosign-release: 'v3.1.1'
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Base64-encoded minisign secret key for signing self-update artifacts.
          MINISIGN_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
          COSIGN_YES: 'true'
