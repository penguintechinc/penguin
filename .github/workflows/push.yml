name: Publish Docker image on push

on:
  push:
    branches: ['main']

env:
  REPO: insert-repo-name-here

jobs:
  build-platform:
    name: Build Docker image for ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        platform: [linux/amd64, linux/arm64]
    permissions:
      packages: write
      contents: read
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a  # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd  # v4

      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get epoch timestamp
        id: epoch
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Determine platform tag
        id: platform-tag
        run: |
          case "${{ matrix.platform }}" in
            linux/amd64) echo "tag=amd64" >> $GITHUB_OUTPUT ;;
            linux/arm64) echo "tag=arm64" >> $GITHUB_OUTPUT ;;
          esac

      - name: Build and push Docker image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f  # v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:gamma-${{ steps.epoch.outputs.timestamp }}-${{ steps.platform-tag.outputs.tag }}
            ghcr.io/${{ github.repository }}:alpha-${{ steps.epoch.outputs.timestamp }}-${{ steps.platform-tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  merge-manifests:
    name: Merge platform manifests
    needs: build-platform
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121  # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Get epoch timestamp
        id: epoch
        run: echo "timestamp=$(date +%s)" >> $GITHUB_OUTPUT

      - name: Create and push gamma manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:gamma-${{ steps.epoch.outputs.timestamp }} \
            ghcr.io/${{ github.repository }}:gamma-${{ steps.epoch.outputs.timestamp }}-amd64 \
            ghcr.io/${{ github.repository }}:gamma-${{ steps.epoch.outputs.timestamp }}-arm64

      - name: Create and push alpha manifest
        run: |
          docker buildx imagetools create \
            -t ghcr.io/${{ github.repository }}:alpha-${{ steps.epoch.outputs.timestamp }} \
            ghcr.io/${{ github.repository }}:alpha-${{ steps.epoch.outputs.timestamp }}-amd64 \
            ghcr.io/${{ github.repository }}:alpha-${{ steps.epoch.outputs.timestamp }}-arm64
