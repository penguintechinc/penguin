[package]
name = "penguin-selfprotect"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# Minisign signature verification for the IntegrityManifest — the same
# verify-only wrapper penguin-update's release archives go through. See
# that crate's `verify.rs` doc for why minisign and why verify-only.
penguin-update.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[dev-dependencies]
# Test-only minisign *signing*: generates an ephemeral keypair and signs a
# fixture manifest in-test — same pin and same reasoning as
# penguin-update's own dev-dependency of this crate (see that crate's
# Cargo.toml comment): `minisign-verify` is verify-only by design, so it
# cannot produce a signature for the tamper-rejection test.
minisign = "=0.9.1"
