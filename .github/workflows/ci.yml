# PR gate: lint, security scans, and race-tested build in the standard
# golang:1.25-bookworm toolchain. Actions are pinned to commit SHAs per policy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: golangci-lint
        uses: golangci/golangci-lint-action@55c2c1448f86e01eaae002a5a3a9624417608d84 # v6
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Unit tests (race + coverage gate)
        run: make test

  security:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.1.4
          govulncheck ./...
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0
          gosec -exclude-generated ./...

  build:
    runs-on: ubuntu-latest
    container: golang:1.25-bookworm
    env:
      GOFLAGS: -buildvcs=false
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - name: Build all binaries + example plugin
        run: |
          make build
          go build -o /tmp/plugin-hello ./examples/plugin-hello
      - name: Smoke test
        run: make smoke-test
