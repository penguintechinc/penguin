# cargo-deny policy for the penguin Rust workspace.
# Run: cargo deny check   (licenses, advisories, bans, sources)

[advisories]
# Fail on any known RustSec advisory (the cargo-audit equivalent gate).
yanked = "deny"

[licenses]
# Permissive licenses only. MPL-2.0 is allowed specifically because the
# vendored hashicorp/go-plugin .proto files carry MPL-2.0 headers.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Surface accidental duplicate dependency versions; not fatal during the port.
multiple-versions = "warn"
wildcards = "deny"

[sources]
# Only crates.io — never a private/internal registry.
unknown-registry = "deny"
unknown-git = "deny"
