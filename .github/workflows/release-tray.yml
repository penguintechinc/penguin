# Tray release: build penguin-tray with cgo (systray needs objc on macOS, the
# X11/AppIndicator C libs on Linux, and the Win32 API on Windows). Because cgo
# cross-compilation needs a matching C toolchain, each target builds on a
# NATIVE-architecture runner — never GOARCH cross with CGO_ENABLED=1. Uploaded as
# release assets on version tags. Actions pinned to commit SHAs per policy.
name: Release Tray

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-tray:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest        # native amd64
            goos: linux
            goarch: amd64
            ext: ''
          - os: ubuntu-24.04-arm     # native arm64 hosted runner
            goos: linux
            goarch: arm64
            ext: ''
          - os: macos-13             # native Intel runner
            goos: darwin
            goarch: amd64
            ext: ''
          - os: macos-latest         # native Apple-silicon runner
            goos: darwin
            goarch: arm64
            ext: ''
          - os: windows-latest       # native amd64
            goos: windows
            goarch: amd64
            ext: '.exe'
          # windows/arm64: no stable native hosted runner yet — add windows-11-arm
          # here once it leaves preview (cgo cross from amd64 will not link).
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.25'

      - name: Linux systray build deps
        if: matrix.goos == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-dev libayatana-appindicator3-dev

      - name: Extract version from tag
        id: version
        run: echo "tag=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
        shell: bash

      - name: Build penguin-tray (native cgo)
        run: |
          out="penguin-tray_${{ steps.version.outputs.tag }}_${{ matrix.goos }}_${{ matrix.goarch }}${{ matrix.ext }}"
          go build \
            -tags noxdp \
            -ldflags "-s -w -X github.com/penguintechinc/penguin/internal/version.Version=${{ steps.version.outputs.tag }}" \
            -o "$out" \
            ./cmd/penguin-tray
          echo "asset=$out" >> "$GITHUB_OUTPUT"
        id: build
        env:
          CGO_ENABLED: 1
        shell: bash

      - name: Upload release asset
        run: gh release upload "${{ steps.version.outputs.tag }}" "${{ steps.build.outputs.asset }}" --repo penguintechinc/penguin --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
