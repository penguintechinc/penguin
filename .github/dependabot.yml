# Dependabot for the penguin repo: the Rust workspace (root), the frozen Go
# client (go-client/), and pinned GitHub Actions.
version: 2
updates:
  # Rust workspace dependencies.
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  # Frozen Go client module.
  - package-ecosystem: "gomod"
    directory: "/go-client"
    schedule:
      interval: "weekly"
  # Keep pinned GitHub Actions commit SHAs current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
