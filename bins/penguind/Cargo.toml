[package]
name = "penguind"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[lints]
workspace = true

[dependencies]
# The daemon library holds all the logic; this binary only wires it to a
# transport, a config directory, and the process lifecycle. penguin-ipc lives
# here rather than in the library so the library stays testable without sockets.
penguin-daemon.workspace = true
penguin-ipc.workspace = true
penguin-telemetry.workspace = true
penguin-sdk.workspace = true
penguin-proto.workspace = true
# The real M4 secret store and license client this binary wires into
# DaemonHostFactory (see src/daemon_main.rs and src/host_wiring.rs). Not
# workspace dependencies yet (only added there per-milestone as each crate
# lands), so referenced by path — same convention as penguin-cli-core in
# bins/pdcli/Cargo.toml.
penguin-secrets = { path = "../../crates/penguin-secrets" }
penguin-licensing = { path = "../../crates/penguin-licensing" }
# Builds the OTLP pipeline gated on the `penguin.otel` license flag — see
# src/daemon_main.rs's otel wiring block.
penguin-otel.workspace = true
# Built-in module registry (squawk, and future built-ins) — see
# `src/daemon_main.rs`'s `SupervisorConfig::registry` wiring.
penguin-registry = { path = "../../crates/penguin-registry" }
# M7.2: the real self-updater `DaemonService`'s `UpdateClient` hook wires to
# — see `src/daemon_main.rs`'s `SelfUpdateClient` adapter. Now a workspace
# dependency (promoted for penguin-selfprotect — see root Cargo.toml), but
# left path-referenced here rather than switched to `.workspace = true` to
# keep this task's diff scoped to penguin-selfprotect.
penguin-update = { path = "../../crates/penguin-update" }
# M8: authorizes `penguind service uninstall` (local secret / break-glass
# token / console deauthorization) — see src/service/mod.rs's teardown
# gate. Path-referenced rather than `.workspace = true`, matching the
# convention above (penguin-secrets, penguin-licensing, penguin-update) of
# keeping this binary's per-milestone crates path-scoped even once they're
# promoted to workspace dependencies for another consumer.
penguin-selfprotect = { path = "../../crates/penguin-selfprotect" }

tokio.workspace = true
tokio-stream.workspace = true
tokio-util.workspace = true
tonic.workspace = true
tonic-health.workspace = true
tracing.workspace = true
clap.workspace = true
# `SelfUpdateClient`'s `#[async_trait]` impl of `penguin_daemon::service::UpdateClient`.
async-trait.workspace = true

# M7.1: `penguind service <action>` — drives the systemd/launchd/SCM verbs.
# We write our OWN hardened unit content (packaging/systemd/penguind.service,
# embedded via include_str!) rather than the crate's generated one; see
# workspace Cargo.toml's comment on this dependency.
service-manager.workspace = true

# Combined JSON stdout + LogRing tracing subscriber (see src/logging.rs) —
# not a dependency of penguin-daemon itself, only of this binary's wiring.
tracing-subscriber.workspace = true
# Startup error enum (DaemonBinError).
thiserror.workspace = true
# Resolves the daemon's own uid for PeerAuthInterceptor (already pulled in
# transitively via penguin-ipc, so the base dependency adds nothing new) and,
# via the extra "hostname" feature, the `node_id` resource attribute tagged
# on every OTel export in src/daemon_main.rs's otel wiring block.
nix = { workspace = true, features = ["hostname"] }

[dev-dependencies]
# Test-only scratch directories for host_wiring.rs's secret-store isolation
# tests. Not a workspace dependency — same direct-crates.io convention
# penguin-secrets and penguin-daemon already use for their own dev-deps.
tempfile = "3"

# Windows SCM entry point (cfg(windows)-only; see src/service/windows.rs).
# Placed in its own target table at the end of the file so it cannot
# accidentally swallow later keys from [dependencies]/[dev-dependencies]
# (TOML tables extend until the next header).
[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
